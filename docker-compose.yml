services:
  db:
    image: mysql:8.0
    container_name: BloodBank_db
    restart: always
    environment:
      MYSQL_DATABASE: BloodBank_db
      MYSQL_ROOT_PASSWORD: Manoj@2006
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - homeservice-net

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile.backend   # lowercase
    container_name: BloodBank_dackend
    restart: always
    depends_on:
      - db
    ports:
      - "8081:8081"
    networks:
      - homeservice-net

  frontend:
    build:
      context: ./lifeline-link-22-main
      dockerfile: dockerfile.frontend  # lowercase
    container_name: BloodBank_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - homeservice-net

volumes:
  db_data:

networks:
  homeservice-net:
    driver: bridge
