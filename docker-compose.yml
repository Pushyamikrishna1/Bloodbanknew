version: '3.8'

services:
  frontend:
    build:
      context: ./bloodbank
      dockerfile: Dockerfile
    container_name: bloodbank-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./blood
      dockerfile: Dockerfile
    container_name: bloodbank-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/bloodbank
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Shiva@1234
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: bloodbank-db
    restart: always
    environment:
      MYSQL_DATABASE: bloodbank
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
